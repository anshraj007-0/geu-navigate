<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEU Navigate — Classroom Finder</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fb;color:#172033}.hero{background:linear-gradient(135deg,#0b3b91,#1769e0);color:#fff;padding:58px 20px 70px}.wrap{max-width:900px;margin:auto}.brand{font-weight:800;font-size:20px;letter-spacing:.2px}.hero h1{font-size:44px;line-height:1.05;margin:45px 0 12px}.hero p{opacity:.9;margin:0 0 28px;font-size:16px}.search{display:flex;background:#fff;border-radius:16px;padding:7px;box-shadow:0 16px 40px #001b4d35}.search input{flex:1;border:0;outline:0;font-size:18px;padding:14px 16px;color:#172033}.search button{border:0;border-radius:11px;background:#0b3b91;color:white;padding:0 25px;font-size:16px;font-weight:700;cursor:pointer}.hint{margin-top:13px;font-size:13px;opacity:.8}.content{max-width:900px;margin:-28px auto 0;padding:0 20px 50px}.card{background:#fff;border-radius:18px;padding:25px;box-shadow:0 8px 30px #16213d0d;border:1px solid #e7ebf2}.welcome{text-align:center;padding:55px 20px}.result{display:flex;align-items:center;justify-content:space-between;gap:20px}.label{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#718096;font-weight:700}.building{font-size:30px;font-weight:800;margin:7px 0}.classroom{display:inline-block;background:#eaf2ff;color:#0b4aad;padding:8px 12px;border-radius:9px;font-weight:700}.type{color:#667085;margin-top:8px}.notfound{text-align:center;padding:45px 20px}.updateIcon{width:54px;height:54px;margin:0 auto 16px;border-radius:16px;background:#eaf2ff;color:#1769e0;display:grid;place-items:center;font-size:28px;font-weight:800}.notfound h2{margin:0 0 10px;font-size:28px}.notfound p{color:#667085;margin:7px 0}.notfound .subnote{font-size:14px}.status{display:inline-block;margin-top:18px;background:#f0f4fa;border:1px solid #dce4ef;padding:8px 13px;border-radius:999px;color:#526174;font-size:12px;font-weight:700}.count{margin:0 0 14px;color:#667085;font-size:14px}.examples{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.chip{background:#f0f4fa;border:1px solid #dce4ef;padding:8px 12px;border-radius:999px;cursor:pointer;font-size:13px}.chip:hover{background:#e5eefc}@media(max-width:650px){.hero{padding-top:35px}.hero h1{font-size:35px;margin-top:35px}.search button{padding:0 17px}.result{align-items:flex-start;flex-direction:column}.building{font-size:25px}}
</style></head><body><section class="hero"><div class="wrap"><div class="brand">GEU Navigate</div><h1>Find your classroom.</h1><p>Enter a classroom code and get its building name.</p><div class="search"><input id="q" autocomplete="off" placeholder="Try: CR 36, CR-36, LT 14" oninput="findRoom()"><button onclick="findRoom()">Search</button></div><div class="hint">Only classroom / lecture-theatre information is used. Roll numbers are not included.</div></div></section><main class="content"><div id="out" class="card welcome"><h2>Search a class</h2><p>Example: <b>CR 36</b> → <b>Old MCA</b></p><div class="examples"><span class="chip" onclick="setQ('CR 36')">CR 36</span><span class="chip" onclick="setQ('CR 45')">CR 45</span><span class="chip" onclick="setQ('LT 14')">LT 14</span><span class="chip" onclick="setQ('CR 39')">CR 39</span></div></div></main><script>const rooms=[{"code": "LT 14", "building": "B.Tech Block", "type": "Lecture Theatre"}, {"code": "CR 15", "building": "B.Tech Block", "type": "Classroom"}, {"code": "CR 16", "building": "B.Tech Block", "type": "Classroom"}, {"code": "CR 17", "building": "B.Tech Block", "type": "Classroom"}, {"code": "CR 18", "building": "B.Tech Block", "type": "Classroom"}, {"code": "LT 15", "building": "B.Tech Block", "type": "Lecture Theatre"}, {"code": "TR 08", "building": "Civil Block", "type": "Tutorial Room"}, {"code": "CR 20", "building": "Civil Block", "type": "Classroom"}, {"code": "CR 21", "building": "Civil Block", "type": "Classroom"}, {"code": "TR 09", "building": "Civil Block", "type": "Tutorial Room"}, {"code": "CR 22", "building": "Civil Block", "type": "Classroom"}, {"code": "CR 24", "building": "Civil Block", "type": "Classroom"}, {"code": "CR 25", "building": "Civil Block", "type": "Classroom"}, {"code": "CR 23", "building": "Civil Block", "type": "Classroom"}, {"code": "CR 26", "building": "GEU Block", "type": "Classroom"}, {"code": "CR 27", "building": "GEU Block", "type": "Classroom"}, {"code": "CR 28", "building": "GEU Block", "type": "Classroom"}, {"code": "CR 29", "building": "GEU Block", "type": "Classroom"}, {"code": "CR 30", "building": "GEU Block", "type": "Classroom"}, {"code": "CR 31", "building": "GEU Block", "type": "Classroom"}, {"code": "CR 43", "building": "GEU Block", "type": "Classroom"}, {"code": "GEU 10", "building": "GEU Block", "type": "Room"}, {"code": "CR 32", "building": "Old MCA", "type": "Classroom"}, {"code": "CR 33", "building": "Old MCA", "type": "Classroom"}, {"code": "CR 34", "building": "Old MCA", "type": "Classroom"}, {"code": "CR 35", "building": "Old MCA", "type": "Classroom"}, {"code": "CR 36", "building": "Old MCA", "type": "Classroom"}, {"code": "CR 37", "building": "Old MCA", "type": "Classroom"}, {"code": "CR 38", "building": "Old MCA", "type": "Classroom"}, {"code": "CR 46", "building": "Old MCA", "type": "Classroom"}, {"code": "CR 44", "building": "Old MCA", "type": "Classroom"}, {"code": "CR 45", "building": "Old MCA", "type": "Classroom"}, {"code": "CR 47", "building": "Old MCA", "type": "Classroom"}, {"code": "CR 41", "building": "Mechanical Block", "type": "Classroom"}, {"code": "LT 19", "building": "Chanakya Block", "type": "Lecture Theatre"}, {"code": "TR 10", "building": "Chanakya Block", "type": "Tutorial Room"}, {"code": "LT 22", "building": "K.P. Nautiyal Block", "type": "Lecture Theatre"}, {"code": "CR 39", "building": "K.P. Nautiyal Block", "type": "Classroom"}, {"code": "LT 23", "building": "K.P. Nautiyal Block", "type": "Lecture Theatre"}, {"code": "CR 40", "building": "K.P. Nautiyal Block", "type": "Classroom"}, {"code": "LT 24", "building": "K.P. Nautiyal Block", "type": "Lecture Theatre"}, {"code": "LT 25", "building": "K.P. Nautiyal Block", "type": "Lecture Theatre"}, {"code": "LT 26", "building": "K.P. Nautiyal Block", "type": "Lecture Theatre"}, {"code": "TR 13", "building": "K.P. Nautiyal Block", "type": "Tutorial Room"}, {"code": "LT 01", "building": "CS/IT Block", "type": "Lecture Theatre"}, {"code": "LT 02", "building": "CS/IT Block", "type": "Lecture Theatre"}, {"code": "LT 03", "building": "CS/IT Block", "type": "Lecture Theatre"}, {"code": "LT 04", "building": "CS/IT Block", "type": "Lecture Theatre"}, {"code": "LT 05", "building": "CS/IT Block", "type": "Lecture Theatre"}, {"code": "LT 06", "building": "CS/IT Block", "type": "Lecture Theatre"}, {"code": "LT 07", "building": "CS/IT Block", "type": "Lecture Theatre"}, {"code": "LT 09", "building": "CS/IT Block", "type": "Lecture Theatre"}, {"code": "LT 10", "building": "CS/IT Block", "type": "Lecture Theatre"}, {"code": "LT 11", "building": "CS/IT Block", "type": "Lecture Theatre"}, {"code": "CR 01", "building": "CS/IT Block", "type": "Classroom"}, {"code": "CR 02", "building": "CS/IT Block", "type": "Classroom"}, {"code": "CR 03", "building": "CS/IT Block", "type": "Classroom"}, {"code": "CR 04", "building": "CS/IT Block", "type": "Classroom"}, {"code": "CR 05", "building": "CS/IT Block", "type": "Classroom"}, {"code": "CR 06", "building": "CS/IT Block", "type": "Classroom"}, {"code": "CR 07", "building": "CS/IT Block", "type": "Classroom"}, {"code": "CR 08", "building": "CS/IT Block", "type": "Classroom"}, {"code": "CR 09", "building": "CS/IT Block", "type": "Classroom"}, {"code": "CR 10", "building": "CS/IT Block", "type": "Classroom"}];function norm(s){return s.toLowerCase().replace(/[-_]/g,' ').replace(/\s+/g,' ').trim();}function setQ(v){document.getElementById('q').value=v;findRoom()}function findRoom(){const raw=document.getElementById('q').value,q=norm(raw),out=document.getElementById('out');if(!q){out.className='card welcome';out.innerHTML='<h2>Search a class</h2><p>Enter a classroom code to see its building.</p>';return}const exact=rooms.filter(x=>norm(x.code)===q);const partial=rooms.filter(x=>!exact.includes(x)&&(norm(x.code).includes(q)||norm(x.building).includes(q))).slice(0,20);const found=exact.length?exact:partial;if(!found.length){out.className='card notfound';out.innerHTML='<div class="updateIcon">↗</div><h2>Update Coming Soon</h2><p>We couldn’t find <b>'+raw.replace(/</g,'&lt;')+'</b> in the current classroom list.</p><p class="subnote">This class may be added in a future update. Please check back soon.</p><span class="status">GEU Navigate • More locations coming soon</span>';return}out.className='card';out.innerHTML='<p class="count">'+found.length+' result'+(found.length>1?'s':'')+'</p>'+found.map(x=>'<div class="result"><div><div class="label">Building</div><div class="building">'+x.building+'</div><span class="classroom">'+x.code+'</span><div class="type">'+x.type+'</div></div></div>').join('<hr style="border:0;border-top:1px solid #edf0f5;margin:22px 0">');}</script></body></html>
